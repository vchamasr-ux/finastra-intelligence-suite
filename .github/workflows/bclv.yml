name: Finastra BCLV

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite-and-production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
